# Primitive usage:
# import YAML
# data = YAML.load_file("default_theme.yml")
# println(data)

# named colours for incidents and markers
colour:
    Removal:                   "tan"
    CRemoval:                  "purple"
    Infection:                 "orange"
    PInfection:                "darkgreen"
    AbstractInfectionMarker:   "orange"
    AbstractRemovalMarker:     "tan"
    AbstractSusceptibleMarker: "blue"

# named colour for other purposes
colour_x:
    blank:                     "white"    
    scaffold:                  "grey"
    forbid1:                   "steelblue" 
    forbid2:                   "lightsteelblue"
    legend:                    "black"
    background:                "bisque"
    default:                   "white"

length_cy:
    # node radius in `cy` units
    radius:                0.20
    # vertical offset in `cy` units
    height:                0.00
    # tic size in `cy` units
    tic:                  -0.20
    
length_h:
    bit:                  -0.02

# label offsets in inches
length_inch:
    xlab:                 -0.40
    yloc:                  0.25
    figwidth:              6
    figheight:             3.25

# shrinkage factor for small radius
length_factor:
    smradius:              0.90

#  line thicknesses in mm
thickness_mm:
    boundary:              1.00
    trail:                 0.75
    dormant:               0.25
    broad:                 2.00
    activated:             0.75

# background opacity
opacity:
    background:            0.30

# jitter
jitter:
    ϵ:                     1e-7
