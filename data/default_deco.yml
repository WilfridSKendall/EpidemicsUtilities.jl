# named colours for incidents and markers
colour:
    Removal:                   "tan"
    CRemoval:                  "purple"
    Infection:                 "orange"
    PInfection:                "darkgreen"
    AbstractInfectionMarker:   "orange"
    AbstractRemovalMarker:     "tan"
    AbstractSusceptibleMarker: "blue"

# named colour for other purposes
colour_x:
    blank:                     "white"    
    scaffold:                  "grey"
    forbid1:                   "steelblue" 
    forbid2:                   "lightsteelblue"
    background:                "bisque"
    default:                   "white"

#default_deco = (
#  radius   =  0.2cy,               smradius =  0.9 * 0.2cy,
#  bit      = -0.02h,               tic      = -0.2cy,
#  xlab     =  0cx-0.4inch,         yloc     = 0.25inch,
#  height   =  0.0cy,              
#  boundary =  linewidth(1.00mm),   trail    =  linewidth(0.75mm),
#  broad    =  linewidth(2.00mm),
#  realized =  linewidth(0.75mm),   dormant  =  linewidth(0.25mm),
#  blank    =  colorant"white",     scaffold =  colorant"grey",
#  forbid1  =  colorant"steelblue", forbid2  =  colorant"lightsteelblue", 
#  region   =  (context(), rectangle(), fill(colorant"bisque"), fillopacity(0.3)),
#  colour   =  default_colour,
#)

length_cy:
    # node radius in `cy` units
    radius:                0.20
    # vertical offset in `cy` units
    height:                0.00
    # tic size in `cy` units
    tic:                  -0.20
length_h:
    bit:                  -0.02
# label offsets in inches
length_inch:
    xlab:                 -0.40
    yloc:                  0.25
# shrinkage factor for small radius
length_factor:
    smradius:              0.90

#  line thicknesses in mm
thickness_mm:
    boundary:              1.00
    trail:                 0.75
    dormant:               0.25
    broad:                 2.00
    realized:              0.75

# background opacity
opacity:
    background:            0.30
