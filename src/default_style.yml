# named colours
blank:                     "white"    
scaffold:                  "grey"
forbid1:                   "steelblue" 
forbid2:                   "lightsteelblue"
background:                "bisque"

Removal:                   "tan"
CRemoval:                  "purple"
Infection:                 "orange"
PInfection:                "darkgreen"
AbstractInfectionMarker:   "orange"
AbstractRemovalMarker:     "tan"
AbstractSusceptibleMarker: "tan"

default:                   "white"

