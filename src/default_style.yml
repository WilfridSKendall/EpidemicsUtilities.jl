# node radius in `cy` units
radius:                    0.2
# shrinkage factor for small radius
small_radius_factor:       0.9
# 
bit:                      -0.02
# tic size in `cy` units
tic:                      -0.02
# label offsets in inches
x_label_offset:           -0.4
y_location:                0.25
# vertical offset in `cy` units
height_offset:             0.0

#  line thicknesses in mm
trail_thickness:           0.75
dormant_thickness:         0.25
broad_thickness:           2.00
realized_thickness:        0.75
dormant_thickness:         0.25

# background opacity
backopacity:               0.3
